server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: incident-analyzer-app
  jmx:
    enabled: false

# Logs: Logback → OpenTelemetry LogbackAppender → SdkLoggerProvider (OTLP/gRPC).
# Uses OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_LOGS_ENDPOINT,
# management.tracing.exporter.otlp.endpoint, or metrics OTLP URL (see OpenTelemetryLoggingConfiguration).

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      otlp:
        enabled: true
        url: http://otel-collector:4317
  tracing:
    propagation:
      type: w3c
    exporter:
      otlp:
        endpoint: http://otel-collector:4317

logging:
  level:
    root: INFO
    com.incident: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10
