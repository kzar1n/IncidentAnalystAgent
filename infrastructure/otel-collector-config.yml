receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1024
    timeout: 10s
    send_batch_max_size: 2048

  attributes:
    actions:
      - key: service.name
        value: incident-analyzer
        action: insert

exporters:
  otlp:
    endpoint: signoz-otel-collector:4317
    tls:
      insecure: true

  logging:
    loglevel: debug

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, attributes]
      exporters: [otlp, logging]
    
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
    
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, logging]
